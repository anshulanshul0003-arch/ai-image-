<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #13131a; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background-color: #1a1a24; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #2d2d3b; gap: 15px; }
        .sidebar h2 { font-size: 1.1rem; color: #a29bfe; }
        .upload-box { background-color: #222230; padding: 12px; border-radius: 8px; border: 1px dashed #6c5ce7; text-align: center; }
        .upload-box input { display: none; }
        .upload-btn { background-color: #6c5ce7; color: white; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; display: inline-block; margin-top: 5px; }
        .preview { max-width: 100%; height: 100px; object-fit: cover; border-radius: 5px; margin-top: 8px; display: none; }
        
        .memory-info { font-size: 0.8rem; color: #b2bec3; background: #222230; padding: 10px; border-radius: 6px; flex: 1; overflow-y: auto; }
        .clear-btn { background: #ff7675; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }

        /* Main Chat Area */
        .main { flex: 1; display: flex; flex-direction: column; background-color: #13131a; }
        .chat-header { padding: 15px 20px; background-color: #1a1a24; border-bottom: 1px solid #2d2d3b; font-size: 1rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user-msg { align-self: flex-end; background-color: #6c5ce7; color: white; }
        .ai-msg { align-self: flex-start; background-color: #222230; color: #dfe6e9; border: 1px solid #2d2d3b; }
        .ai-img { max-width: 100%; border-radius: 8px; margin-top: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* Input Box */
        .input-area { padding: 15px 20px; background-color: #1a1a24; border-top: 1px solid #2d2d3b; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #2d2d3b; background-color: #13131a; color: white; outline: none; font-size: 0.95rem; }
        .input-area button { padding: 0 20px; background-color: #6c5ce7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Personal Assistant 🤖</h2>
        <div class="upload-box">
            <span style="font-size: 0.75rem; color: #b2bec3;">Reference Photo (Face/Style)</span><br>
            <label for="fileInput" class="upload-btn">📁 Upload</label>
            <input type="file" id="fileInput" accept="image/*" onchange="loadImg(event)">
            <img id="imgPrev" class="preview">
        </div>
        
        <div style="font-size: 0.85rem; color: #a29bfe; font-weight: bold;">Memory Status:</div>
        <div class="memory-info" id="memLog">All chat history and story context are safely remembered here.</div>
        <button class="clear-btn" onclick="resetChat()">Clear Memory</button>
    </div>

    <div class="main">
        <div class="chat-header">
            <span>ChatGPT Style Fast Assistant</span>
            <span style="font-size: 0.75rem; color: #00b894;">● Online & Fast</span>
        </div>
        
        <div class="chat-messages" id="chatBox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type message or /img [scene description]..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        let refImageBase64 = "";

        window.onload = function() {
            loadSavedChat();
        };

        function loadImg(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(val) {
                    document.getElementById('imgPrev').src = val.target.result;
                    document.getElementById('imgPrev').style.display = 'block';
                    refImageBase64 = val.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function appendUI(text, isUser, isHtml = false) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;
            if(isHtml) {
                div.innerHTML = text;
            } else {
                div.innerText = text;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function saveChat(text, isUser, isHtml = false) {
            let history = JSON.parse(localStorage.getItem('my_ai_history') || '[]');
            history.push({ text, isUser, isHtml });
            localStorage.setItem('my_ai_history', JSON.stringify(history));
            updateMemBox();
        }

        function loadSavedChat() {
            let history = JSON.parse(localStorage.getItem('my_ai_history') || '[]');
            if(history.length === 0) {
                appendUI("Hello! Main aapka personal assistant hoon. Aap mujhse kisi bhi tarah baat kar sakte hain aur /img likhkar cinematic photorealistic images generate kar sakte hain.", false);
            } else {
                history.forEach(item => appendUI(item.text, item.isUser, item.isHtml));
            }
            updateMemBox();
        }

        function updateMemBox() {
            let history = JSON.parse(localStorage.getItem('my_ai_history') || '[]');
            document.getElementById('memLog').innerText = `Saved items: ${history.length} messages in memory. Context is active!`;
        }

        function resetChat() {
            localStorage.removeItem('my_ai_history');
            document.getElementById('chatBox').innerHTML = '';
            appendUI("Memory clear ho gayi hai. Naye sire se shuru karte hain!", false);
            updateMemBox();
        }

        async function sendMsg() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            appendUI(text, true);
            saveChat(text, true, false);
            input.value = "";

            if(text.startsWith('/img ')) {
                const prompt = text.replace('/img ', '').trim();
                const loadId = document.createElement('div');
                loadId.className = 'message ai-msg';
                loadId.innerText = 'Generating ultra-realistic cinematic image... ⏳';
                document.getElementById('chatBox').appendChild(loadId);

                const seed = Math.floor(Math.random() * 999999);
                // Ultra realistic prompt style matching high quality aesthetic
                const qualityTags = "hyper-realistic portrait, cinematic soft lighting, detailed facial features, 8k resolution, photorealistic masterpiece, dramatic depth of field";
                const fullPrompt = encodeURIComponent(`${prompt}, ${qualityTags}`);
                
                const imgUrl = `https://pollinations.ai/p/${fullPrompt}?width=1000&height=1500&seed=${seed}&model=flux&nologo=true`;

                const testImg = new Image();
                testImg.src = imgUrl;
                testImg.onload = function() {
                    loadId.remove();
                    const htmlContent = `📸 <b>Generated Scene:</b><br><img src="${imgUrl}" class="ai-img">`;
                    appendUI(htmlContent, false, true);
                    saveChat(htmlContent, false, true);
                };
                testImg.onerror = function() {
                    loadId.remove();
                    appendUI("Image generation mein error aaya. Dubara try karein.", false);
                };
            } else {
                // Instant Fast AI Chat Response
                const loadId = document.createElement('div');
                loadId.className = 'message ai-msg';
                loadId.innerText = 'Typing...';
                document.getElementById('chatBox').appendChild(loadId);

                try {
                    const systemContext = "You are a smart, friendly, and fast personal AI assistant speaking in Hinglish. Remember all context and help the user actively.";
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(systemContext + " User: " + text)}`);
                    const reply = await res.text();
                    
                    loadId.remove();
                    appendUI(reply, false);
                    saveChat(reply, false, false);
                } catch(e) {
                    loadId.remove();
                    const fallback = "Haan bhai, main sun raha hoon! Batao aage kya karna hai.";
                    appendUI(fallback, false);
                    saveChat(fallback, false, false);
                }
            }
        }
    </script>
</body>
</html>
